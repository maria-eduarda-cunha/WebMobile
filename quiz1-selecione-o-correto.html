<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Duo Libras - Quiz</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <header class="cabecalho">
            <a
                href="home.html"
                class="logo"
                aria-label="Página inicial do Duo Libras"
            >
                <img src="img/logo.png" alt="Logo do Duo Libras" class="logo" />
            </a>

            <nav class="menu" aria-label="Menu">
                <section id="remaining-attempts">
                    <span
                        class="material-symbols-outlined coracao"
                        aria-hidden="true"
                        >favorite</span
                    >
                    <span
                        class="material-symbols-outlined coracao"
                        aria-hidden="true"
                        >favorite</span
                    >
                    <span
                        class="material-symbols-outlined coracao"
                        aria-hidden="true"
                        >favorite</span
                    >
                </section>
                <span class="material-symbols-outlined icone" aria-hidden="true"
                    >local_fire_department</span
                >
                <span class="material-symbols-outlined icone" aria-hidden="true"
                    >account_circle</span
                >
            </nav>
        </header>

        <main>
            <progress value="25" max="100">25%</progress>

            <section id="modulos" class="secao-quiz">
                <h2>Selecione o Correto</h2>

                <section class="video-seta">
                    <figure class="video">
                        <img
                            src="assets/imgs/1-libras04.gif"
                            alt="Gif realizando o sinal de Libras na Lingua de Sinais Brasileira"
                        />
                    </figure>

                    <a
                        href="quiz2-arraste-na-ordem.html"
                        id="btn-next"
                        class="seta"
                        disabled
                    >
                        <span class="material-symbols-outlined">
                            arrow_forward_ios
                        </span>
                    </a>
                </section>

                <section>
                    <article class="option" data-option-id="o1">
                        <p>Seleção1</p>
                    </article>
                    <article class="option" data-option-id="o2">
                        <p>Seleção2</p>
                    </article>
                    <article class="option" data-option-id="o3">
                        <p>Seleção3</p>
                    </article>
                    <article class="option" data-option-id="o4">
                        <p>Seleção4</p>
                    </article>
                </section>
            </section>
        </main>

        <script src="assets/core.js"></script>
    </body>
</html>
